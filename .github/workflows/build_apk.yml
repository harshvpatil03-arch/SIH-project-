name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: |
          chmod +x legal_metrology_app/android/gradlew || true
          chmod +x android/gradlew || true

      - name: Install dependencies
        working-directory: legal_metrology_app
        run: flutter pub get

      - name: Build APK (Debug)
        working-directory: legal_metrology_app
        run: flutter build apk --debug

      - name: Build APK (Release)
        working-directory: legal_metrology_app
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log || {
            echo "## ❌ Release Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "### Last 120 lines of build log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: legal_metrology_app/build.log

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-metrology-inspector-apk
          path: legal_metrology_app/build/app/outputs/**/*.apk
          if-no-files-found: error


