name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: |
          chmod +x legal_metrology_app/android/gradlew || true
          chmod +x android/gradlew || true

      - name: Install dependencies
        working-directory: legal_metrology_app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: legal_metrology_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-metrology-inspector-apk
          path: |
            legal_metrology_app/build/app/outputs/flutter-apk/*.apk
            legal_metrology_app/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
