name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffold & Inject Permissions
        working-directory: legal_metrology_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              c = f.read()
          c = c.replace('flutter.minSdkVersion', '21')
          with open('android/app/build.gradle', 'w') as f:
              f.write(c)

          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              m = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.CAMERA\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n'''
          m = m.replace('<application', perms + '    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(m)
          "

      - name: Install dependencies
        working-directory: legal_metrology_app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: legal_metrology_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-metrology-inspector-apk
          path: legal_metrology_app/build/app/outputs/flutter-apk/*.apk
